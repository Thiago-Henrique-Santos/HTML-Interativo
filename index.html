<!DOCTYPE html>
<html lang="pt-br">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Interativo</title>
    <link rel="stylesheet" href="style.css">
    <script type="text/javascript" src="./script.js" defer=""></script>
    <link rel="stylesheet" href="./style.css">
  </head>

  <body>
    <div class="game-container">
      <aside class="toolbox">
        <h2>Arraste para o bloco do "site"</h2>
        <div id="origin" class="slot">
          <div class="block" draggable="true" id="b1" data-tag="doctype">&lt;!DOCTYPE html&gt;</div>

          <div class="block container" draggable="true" id="b2" data-tag="html">
            <span class="tag-open">&lt;html lang="pt-br"&gt;</span>
            <span class="tag-close">&lt;/html&gt;</span>
          </div>

          <div class="block container" draggable="true" id="b3" data-tag="head">
            <span class="tag-open">&lt;head&gt;</span>
            <span class="tag-close">&lt;/head&gt;</span>
          </div>

          <div class="block container" draggable="true" id="b4" data-tag="body">
            <span class="tag-open">&lt;body&gt;</span>
            <span class="tag-close">&lt;/body&gt;</span>
          </div>

          <div class="block container" draggable="true" id="b5" data-tag="meta">
            <span class="tag-open">&lt;meta charset="utf-8"&gt;</span>
            <span class="tag-close"></span>
          </div>

          <div class="block container" draggable="true" id="b6" data-tag="title">
            <span class="tag-open">&lt;title&gt; Hotwheels - Home</span>
            <span class="tag-close">&lt;/title&gt;</span>
          </div>

          <div class="block container" draggable="true" id="b7" data-tag="h1">
            <span class="tag-open">&lt;h1&gt; Site sobre Hotwheels</span>
            <span class="tag-close">&lt;/h1&gt;</span>
          </div>

          <div class="block container" draggable="true" id="b8" data-tag="p">
            <span class="tag-open">&lt;p&gt; Marca de miniaturas...</span>
            <span class="tag-close">&lt;/p&gt;</span>
          </div>

          <div class="block container" draggable="true" id="b9" data-tag="a">
            <span class="tag-open">&lt;a href=""&gt; Compre Hotwheels</span>
            <span class="tag-close">&lt;/a&gt;</span>
          </div>
        </div>
      </aside>

      <main class="workspace">
        <h2>Monte seu Site Aqui</h2>
        <div id="target" class="main-dropzone">
        </div>
      </main>
    </div>
    <script src="script.js"></script>

  </body>

</html>
